<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <!-- Header -->
      <header class="head">
        <div class="brand">
          <svg viewBox="0 0 24 24" class="brand-ic" aria-hidden="true">
            <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9Zm0 2a7 7 0 0 1 4.9 2H7.1A7 7 0 0 1 12 5Zm0 14a7 7 0 0 1-4.9-2h9.8A7 7 0 0 1 12 19Zm3-7a3 3 0 1 1-3-3 3 3 0 0 1 3 3Z" opacity=".35"/>
            <path fill="currentColor" d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4Zm0 6a2 2 0 1 1 2-2 2 2 0 0 1-2 2Z"/>
            <path fill="currentColor" d="M11 12h2v6h-2z" transform="rotate(45 12 15)"/>
          </svg>
          <div class="brand-txt">
            <h1>Media Downloader</h1>
            <p id="pageInfo" class="page-info" title="">Scanning page…</p>
          </div>
        </div>
        <span id="countPill" class="pill hidden">0</span>
      </header>

      <!-- Toolbar -->
      <section class="toolbar" id="toolbar">
        <div class="filters" role="group" aria-label="Media type filters">
          <button class="chip is-active" data-filter="all">All</button>
          <button class="chip" data-filter="image">Images</button>
          <button class="chip" data-filter="video">Videos</button>
          <button class="chip" data-filter="audio">Audio</button>
        </div>
        <div class="actions">
          <button id="selectAll" class="btn-ghost" type="button">Select all</button>
          <button id="downloadBtn" class="btn-primary" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3v10.6l-3.3-3.3L7.3 11.7 12 16.4l4.7-4.7-1.4-1.4-3.3 3.3V3h-2ZM5 19h14v2H5z"/></svg>
            <span>Download</span>
          </button>
        </div>
      </section>

      <!-- Media grid -->
      <section id="grid" class="grid" aria-live="polite"></section>

      <!-- Loading -->
      <div id="loading" class="state">
        <span class="spinner"></span>
        <p>Collecting media on this page…</p>
      </div>

      <!-- Empty state -->
      <div id="empty" class="state hidden">
        <div class="state-ic">🖼️</div>
        <h2>No media found</h2>
        <p>This page has no images, videos or audio yet. Try scrolling the page, then reopen the extension.</p>
        <button id="rescan" class="btn-ghost" type="button">Rescan page</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
